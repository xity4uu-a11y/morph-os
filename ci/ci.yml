# Reference CI pipeline specification (copy to .github/workflows/ci.yml if workflow token scope is enabled)
name: morph-os CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-core:
    name: Rust Core (clippy + test + release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p morph-core --all-targets -- -D warnings
      - run: cargo test -p morph-core -- --nocapture
      - run: cargo build --release -p morph-core
      - run: ./target/release/morph-os validate-plugins --dir plugins
      - run: ./target/release/morph-os run --rule cli-table-to-json -- ./target/release/morph-os demo-cli

  wasm-plugins-ui:
    name: WASM Kernel + Plugin Schema + Control Panel UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/compile-wasm.mjs
      - run: node scripts/validate-plugins.mjs
      - run: node bin/create-morph-os.mjs --version
      - run: node bin/create-morph-os.mjs --dry-run
      - working-directory: ui
        run: |
          npm ci || npm install
          npm run typecheck
          npm test
          npm run build
