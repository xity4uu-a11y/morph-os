[package]
name = "morph-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core pure-Rust runtime stream, HTTP reverse-proxy, and eBPF observability engine for morph-os"

[[bin]]
name = "morph-os"
path = "src/bin/morph-os.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
mio = ">=1.0, <1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = ">=1.44, <1.46", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "process", "sync", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
