[package]
name = "morph-os-desktop"
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["xity4uu-a11y"]
description = "Tauri v2 desktop Control Panel for morph-os runtime stream, API, and DOM mutator"

[lib]
name = "morph_os_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
morph-core = { path = "../crates/morph-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
