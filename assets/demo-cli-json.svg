<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580" role="img" aria-label="15-second demo: morph-os mutating legacy CLI stdout ASCII table into strict typed JSON locally in 1.4ms">
  <!-- Outer Obsidian Frame -->
  <rect width="1080" height="580" rx="14" fill="#0b0c0f"/>
  <rect x="1" y="1" width="1078" height="578" rx="13" fill="none" stroke="#23262f" stroke-width="1"/>

  <!-- Window Title Bar -->
  <rect x="1" y="1" width="1078" height="44" rx="13" fill="#12141a"/>
  <line x1="1" y1="45" x2="1079" y2="45" stroke="#23262f" stroke-width="1"/>
  <circle cx="24" cy="23" r="5" fill="#3a3e49"/>
  <circle cx="42" cy="23" r="5" fill="#3a3e49"/>
  <circle cx="60" cy="23" r="5" fill="#3a3e49"/>
  <text x="86" y="27" fill="#d4d7de" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">morph-os run --rule cli-table-to-json -- legacy-ps-tool</text>

  <!-- Right Telemetry Pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <rect x="650" y="11" width="132" height="24" rx="12" fill="#181b22" stroke="#2c303b"/>
    <text x="716" y="27" text-anchor="middle" fill="#b4bac6">LATENCY: 1.4ms</text>

    <rect x="792" y="11" width="132" height="24" rx="12" fill="#12211a" stroke="#204533"/>
    <text x="858" y="27" text-anchor="middle" fill="#63d297">CLOUD: 0 BYTES</text>

    <rect x="934" y="11" width="126" height="24" rx="12" fill="#12211a" stroke="#204533"/>
    <text x="997" y="27" text-anchor="middle" fill="#63d297">CIRCUIT: CLOSED</text>
  </g>

  <!-- Command Prompt Banner -->
  <rect x="24" y="64" width="1032" height="42" rx="8" fill="#12141a" stroke="#242731"/>
  <text x="40" y="90" fill="#7c8494" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">$</text>
  <text x="58" y="90" fill="#f5f5f7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">morph-os run --rule cli-table-to-json --stats -- legacy-ps-tool</text>
  <!-- Animated Cursor -->
  <rect x="572" y="76" width="8" height="17" fill="#f5f5f7">
    <animate attributeName="opacity" values="1;0;1;0;1" dur="15s" repeatCount="indefinite"/>
  </rect>

  <!-- Left Pane: BEFORE (Raw Legacy stdout) -->
  <rect x="24" y="124" width="474" height="388" rx="10" fill="#101217" stroke="#23262f"/>
  <rect x="24" y="124" width="474" height="34" rx="10" fill="#161820"/>
  <line x1="24" y1="158" x2="498" y2="158" stroke="#23262f"/>
  <text x="40" y="146" fill="#d4d7de" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="12" font-weight="600">BEFORE  —  Raw Unstructured CLI stdout</text>
  <text x="482" y="146" text-anchor="end" fill="#7c8494" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">pipe fd=1</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#9ea5b4">
    <text x="40" y="190" fill="#d4d7de" opacity="0">
      PID    SERVICE           STATE     MEM_MB  RESTARTS
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.06;0.10;0.88;0.95;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="212" fill="#575e6e" opacity="0">
      ---------------------------------------------------
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.10;0.14;0.88;0.95;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="238" opacity="0">
      1042   auth-gateway      RUNNING   128.4   0
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.15;0.19;0.88;0.95;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="264" opacity="0">
      1188   ledger-worker     DEGRADED  512.0   3
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.20;0.24;0.88;0.95;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="290" opacity="0">
      1204   legacy-cron       RUNNING   44.2    0
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.25;0.29;0.88;0.95;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="316" opacity="0">
      1319   report-exporter   STOPPED   0.0     1
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.30;0.34;0.88;0.95;1" dur="15s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Left Pane Bottom Annotation -->
  <rect x="40" y="452" width="442" height="44" rx="6" fill="#14171f" stroke="#252936"/>
  <text x="54" y="470" fill="#8e94a0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">LEGACY BINARY: closed-source, no --json flag</text>
  <text x="54" y="486" fill="#7c8494" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Captured safely via explicit child stdio pipe</text>

  <!-- Center Pipeline Transfer Bridge -->
  <g transform="translate(508, 250)">
    <rect x="0" y="0" width="64" height="118" rx="8" fill="#151821" stroke="#363c4d"/>
    <text x="32" y="34" text-anchor="middle" fill="#8e94a0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">MORPH</text>
    <text x="32" y="50" text-anchor="middle" fill="#f5f5f7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600">RUST</text>
    <text x="32" y="66" text-anchor="middle" fill="#63d297" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">1.4ms</text>
    <!-- Animated transfer pulse bar -->
    <rect x="10" y="84" width="44" height="4" rx="2" fill="#232836"/>
    <rect x="10" y="84" width="16" height="4" rx="2" fill="#63d297">
      <animate attributeName="x" values="10;38;10" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="32" y="106" text-anchor="middle" fill="#7c8494" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">LOCAL</text>
  </g>

  <!-- Right Pane: AFTER (Strict Schema-Validated JSON) -->
  <rect x="582" y="124" width="474" height="388" rx="10" fill="#101217" stroke="#23262f"/>
  <rect x="582" y="124" width="474" height="34" rx="10" fill="#161820"/>
  <line x1="582" y1="158" x2="1056" y2="158" stroke="#23262f"/>
  <text x="598" y="146" fill="#d4d7de" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="12" font-weight="600">AFTER  —  Schema-Valid Typed JSON Stream</text>
  <text x="1040" y="146" text-anchor="end" fill="#63d297" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">VALID JSON</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="598" y="188" fill="#d4d7de" opacity="0">[
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.36;0.40;0.88;0.95;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="614" y="208" fill="#d4d7de" opacity="0">{
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.38;0.42;0.88;0.95;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="630" y="228" fill="#93c5fd" opacity="0">"pid": <tspan fill="#fcd34d">1042</tspan><tspan fill="#d4d7de">,</tspan> "service": <tspan fill="#6ee7b7">"auth-gateway"</tspan><tspan fill="#d4d7de">,</tspan>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.41;0.45;0.88;0.95;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="630" y="248" fill="#93c5fd" opacity="0">"state": <tspan fill="#6ee7b7">"RUNNING"</tspan><tspan fill="#d4d7de">,</tspan> "mem_mb": <tspan fill="#fcd34d">128.4</tspan><tspan fill="#d4d7de">,</tspan> "restarts": <tspan fill="#fcd34d">0</tspan>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.44;0.48;0.88;0.95;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="614" y="268" fill="#d4d7de" opacity="0">}, {
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.47;0.51;0.88;0.95;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="630" y="288" fill="#93c5fd" opacity="0">"pid": <tspan fill="#fcd34d">1188</tspan><tspan fill="#d4d7de">,</tspan> "service": <tspan fill="#6ee7b7">"ledger-worker"</tspan><tspan fill="#d4d7de">,</tspan>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.50;0.54;0.88;0.95;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="630" y="308" fill="#93c5fd" opacity="0">"state": <tspan fill="#6ee7b7">"DEGRADED"</tspan><tspan fill="#d4d7de">,</tspan> "mem_mb": <tspan fill="#fcd34d">512.0</tspan><tspan fill="#d4d7de">,</tspan> "restarts": <tspan fill="#fcd34d">3</tspan>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.53;0.57;0.88;0.95;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="614" y="328" fill="#d4d7de" opacity="0">}, {
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.56;0.60;0.88;0.95;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="630" y="348" fill="#93c5fd" opacity="0">"pid": <tspan fill="#fcd34d">1204</tspan><tspan fill="#d4d7de">,</tspan> "service": <tspan fill="#6ee7b7">"legacy-cron"</tspan><tspan fill="#d4d7de">,</tspan>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.59;0.63;0.88;0.95;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="630" y="368" fill="#93c5fd" opacity="0">"state": <tspan fill="#6ee7b7">"RUNNING"</tspan><tspan fill="#d4d7de">,</tspan> "mem_mb": <tspan fill="#fcd34d">44.2</tspan><tspan fill="#d4d7de">,</tspan> "restarts": <tspan fill="#fcd34d">0</tspan>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.62;0.66;0.88;0.95;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="614" y="388" fill="#d4d7de" opacity="0">}, {
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.65;0.69;0.88;0.95;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="630" y="408" fill="#93c5fd" opacity="0">"pid": <tspan fill="#fcd34d">1319</tspan><tspan fill="#d4d7de">,</tspan> "service": <tspan fill="#6ee7b7">"report-exporter"</tspan><tspan fill="#d4d7de">,</tspan>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.68;0.72;0.88;0.95;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="630" y="428" fill="#93c5fd" opacity="0">"state": <tspan fill="#6ee7b7">"STOPPED"</tspan><tspan fill="#d4d7de">,</tspan> "mem_mb": <tspan fill="#fcd34d">0.0</tspan><tspan fill="#d4d7de">,</tspan> "restarts": <tspan fill="#fcd34d">1</tspan>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.71;0.75;0.88;0.95;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="614" y="448" fill="#d4d7de" opacity="0">}
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.74;0.78;0.88;0.95;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="598" y="468" fill="#d4d7de" opacity="0">]
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.76;0.80;0.88;0.95;1" dur="15s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Bottom Telemetry Footer -->
  <rect x="24" y="528" width="1032" height="34" rx="8" fill="#12141a" stroke="#23262f"/>
  <text x="40" y="549" fill="#8e94a0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">[morph-os] rule=cli-table-to-json  engine=deterministic  latency_ms=1.40  exit_code=0  cloud_bytes=0</text>
  <!-- 15-Second Cycle Progress Bar -->
  <rect x="860" y="542" width="180" height="6" rx="3" fill="#20242f"/>
  <rect x="860" y="542" width="0" height="6" rx="3" fill="#63d297">
    <animate attributeName="width" values="0;180" dur="15s" repeatCount="indefinite"/>
  </rect>
</svg>
